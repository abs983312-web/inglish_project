services:
  postgres:
    image: postgres:16-alpine
    container_name: inglish-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inglish
      POSTGRES_PASSWORD: inglish
      POSTGRES_DB: inglish
    ports:
      - "5432:5432"
    volumes:
      - inglish_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inglish -d inglish"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  inglish_pgdata:
